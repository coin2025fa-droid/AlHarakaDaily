name: Build AlHarakaDaily APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AlHarakaDaily_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir project
          unzip -q AlHarakaDaily_Android_Project.zip -d project

      - name: Find Gradle project
        run: |
          GRADLE_FILE=$(find project \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$GRADLE_FILE" ]; then
            echo "لم يتم العثور على ملف settings.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Fix Gradle files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path("project").rglob("*"):
              if p.is_file() and (p.name.endswith(".gradle") or p.name.endswith(".gradle.kts")):
                  s = p.read_text()
                  p.write_text(s.replace("\\n", "\n"))
          PY
          printf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\n' > "$PROJECT_DIR/gradle.properties"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlHarakaDaily-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
