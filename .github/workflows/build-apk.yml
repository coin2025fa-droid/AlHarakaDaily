
name: Build AlHarakaDaily APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AlHarakaDaily_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir project
          unzip -q AlHarakaDaily_Android_Project.zip -d project

      - name: Find Gradle project
        run: |
          GRADLE_FILE=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Fix Gradle properties
        run: |
          printf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\n' > "$PROJECT_DIR/gradle.properties"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlHarakaDaily-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
